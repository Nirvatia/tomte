<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget: на Android экранная клавиатура сжимает приложение, а не перекрывает. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="text-scale" content="scale" />
    <!-- Этап 10.7: установка как приложение (PWA). -->
    <meta name="theme-color" content="#141819" />
    <!-- Тема до первой отрисовки, иначе на светлой системе мелькает тёмный
         экран. Ключ и логика те же, что в src/lib/theme.ts. -->
    <script>
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("tomte:theme") || "system";
        } catch (e) {}
        var light =
          pref === "light" ||
          (pref !== "dark" &&
            window.matchMedia("(prefers-color-scheme: light)").matches);
        var theme = light ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        if (light) {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#f0f3f3");
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
